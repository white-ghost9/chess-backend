<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chess</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111827; }
    #app { width: min(92vw, 820px); background: #1f2937; color: #e5e7eb; border-radius: 18px; padding: 24px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    h1 { margin: 0; }
    button { border: none; background: #2563eb; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    #board { width: 480px; height: 480px; margin: 0 auto 16px; border: 2px solid #333; display: grid; grid-template-columns: repeat(8, 1fr); }
    .square { width: 60px; height: 60px; display: grid; place-items: center; font-size: 32px; cursor: pointer; user-select: none; }
    .light { background: #f0d9b5; }
    .dark { background: #b58863; }
    .selected { outline: 3px solid #60a5fa; }
    .last-move { box-shadow: inset 0 0 0 3px rgba(250, 204, 21, 0.7); }
    .legal::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: rgba(15,23,42,0.3); position: absolute; }
    #status { text-align: center; color: #cbd5e1; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <h1>Real-Time Chess</h1>
      <button id="connectBtn">Create Game</button>
    </div>
    <div id="status">Status: <span id="status-text">Disconnected</span></div>
    <div id="board"></div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{% static 'app.js' %}"></script>
</body>
</html>
